<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Freshers Party Scanner</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
text-align:center;
}

.header {
background:#111;
color:white;
padding:20px;
}

.header h1 {
margin:0;
}

.header p {
margin:8px 0 0;
}

.stats {
display:flex;
gap:10px;
max-width:600px;
margin:auto;
padding:12px;
}

.stat {
flex:1;
background:white;
padding:15px;
border-radius:15px;
}

.number {
font-size:30px;
font-weight:bold;
}

.label {
font-size:13px;
margin-top:5px;
}

.container {
max-width:600px;
margin:auto;
padding:10px 15px 30px;
}

#reader {
background:white;
border-radius:15px;
overflow:hidden;
}

#result {
margin-top:15px;
padding:22px;
border-radius:15px;
background:white;
font-size:18px;
font-weight:bold;
min-height:110px;
}

.success {
background:#d4edda!important;
color:#155724;
}

.duplicate {
background:#fff3cd!important;
color:#856404;
}

.cancelled {
background:#f8d7da!important;
color:#721c24;
}

.invalid {
background:#f8d7da!important;
color:#721c24;
}

.error {
background:#f8d7da!important;
color:#721c24;
}

.loading {
background:#e2e3e5!important;
color:#383d41;
}

</style>

</head>


<body>


<div class="header">

<h1>🎉 Freshers Party</h1>

<p>Entry QR Scanner</p>

</div>


<div class="stats">


<div class="stat">

<div
class="number"
id="registered">
-
</div>

<div class="label">
REGISTERED
</div>

</div>


<div class="stat">

<div
class="number"
id="present">
-
</div>

<div class="label">
PRESENT
</div>

</div>


<div class="stat">

<div
class="number"
id="cancelled">
-
</div>

<div class="label">
CANCELLED
</div>

</div>


</div>


<div class="container">

<div id="reader"></div>


<div id="result">

📷 Point camera at QR code

</div>

</div>


<script>


/************************************************
 * PUT YOUR APPS SCRIPT /EXEC URL HERE
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbxc-P_0jhVrfThNXggbxWibL5mU8X5T6QtKiE_0aq0I35ZUZxkK0euejGERI3Khlv9X-w/exec";


let scanner = null;

let processing = false;


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHTML(value) {

const div =
document.createElement("div");

div.textContent =
String(value || "");

return div.innerHTML;

}


/************************************************
 * SHOW RESULT
 ************************************************/

function showResult(
type,
message
) {

const result =
document.getElementById(
"result"
);

result.className =
type;

result.innerHTML =
message;

}


/************************************************
 * UPDATE COUNTS
 ************************************************/

function updateCounts(data) {

if (
data.registered !== undefined
) {

document.getElementById(
"registered"
).textContent =
data.registered;

}


if (
data.present !== undefined
) {

document.getElementById(
"present"
).textContent =
data.present;

}


if (
data.cancelled !== undefined
) {

document.getElementById(
"cancelled"
).textContent =
data.cancelled;

}

}


/************************************************
 * LOAD COUNTS
 ************************************************/

function loadCounts() {

const callbackName =
"count_" + Date.now();


window[callbackName] =
function(data) {

updateCounts(data);

delete window[callbackName];

};


const script =
document.createElement(
"script"
);


script.src =
API_URL +
"?callback=" +
callbackName;


script.onerror =
function() {

delete window[callbackName];

};


document.body.appendChild(
script
);

}


/************************************************
 * CHECK QR
 ************************************************/

function checkQR(id) {

showResult(
"loading",
"⏳ Checking registration..."
);


const callbackName =
"attendance_" +
Date.now();


let finished = false;


window[callbackName] =
function(data) {

if (finished) {
return;
}

finished = true;


delete window[
callbackName
];


updateCounts(data);


/* SUCCESS */

if (
data.status ===
"success"
) {

showResult(

"success",

"🟢 ENTRY CONFIRMED" +

"<br><br>" +

"Name: <b>" +

escapeHTML(
data.name
) +

"</b>" +

"<br>" +

"Registration ID: <b>" +

escapeHTML(
data.registrationID
) +

"</b>" +

"<br><br>" +

"Entry Time: " +

escapeHTML(
data.time
)

);

}


/* DUPLICATE */

else if (
data.status ===
"duplicate"
) {

showResult(

"duplicate",

"🟠 ALREADY CHECKED IN" +

"<br><br>" +

"Name: <b>" +

escapeHTML(
data.name
) +

"</b>" +

"<br>" +

"Registration ID: <b>" +

escapeHTML(
data.registrationID
) +

"</b>" +

"<br><br>" +

"First Entry: " +

escapeHTML(
data.time
)

);

}


/* CANCELLED */

else if (
data.status ===
"cancelled"
) {

showResult(

"cancelled",

"🔴 REGISTRATION CANCELLED" +

"<br><br>" +

"Name: <b>" +

escapeHTML(
data.name
) +

"</b>" +

"<br>" +

"Registration ID: <b>" +

escapeHTML(
data.registrationID
) +

"</b>" +

"<br><br>" +

"This QR code is no longer valid."

);

}


/* INVALID */

else if (
data.status ===
"invalid"
) {

showResult(

"invalid",

"🔴 INVALID QR CODE" +

"<br><br>" +

"Registration ID: <b>" +

escapeHTML(
data.registrationID
) +

"</b>"

);

}


/* ERROR */

else {

showResult(

"error",

"❌ SERVER ERROR" +

"<br><br>" +

escapeHTML(
data.message ||
"Unknown error"
)

);

}


setTimeout(
restartScanner,
3000
);

};


/************************************************
 * SEND REQUEST
 ************************************************/

const script =
document.createElement(
"script"
);


script.src =
API_URL +

"?id=" +

encodeURIComponent(id) +

"&callback=" +

callbackName;


script.onerror =
function() {

if (finished) {
return;
}

finished = true;


delete window[
callbackName
];


showResult(
"error",
"❌ Cannot connect to attendance server."
);


setTimeout(
restartScanner,
3000
);

};


document.body.appendChild(
script
);

}


/************************************************
 * QR FOUND
 ************************************************/

function onScanSuccess(
decodedText
) {

if (processing) {
return;
}


processing = true;


if (scanner) {

scanner.clear()
.catch(
function() {}
);

}


const id =
String(
decodedText
).trim();


checkQR(id);

}


/************************************************
 * SCAN FAILURE
 ************************************************/

function onScanFailure(
error
) {

// Ignore normal scan failures.

}


/************************************************
 * START SCANNER
 ************************************************/

function startScanner() {

processing = false;


const reader =
document.getElementById(
"reader"
);


reader.innerHTML = "";


scanner =
new Html5QrcodeScanner(

"reader",

{

fps:10,

qrbox:{
width:250,
height:250
},

rememberLastUsedCamera:true

},

false

);


scanner.render(
onScanSuccess,
onScanFailure
);

}


/************************************************
 * RESTART
 ************************************************/

function restartScanner() {

processing = false;

loadCounts();

startScanner();

}


/************************************************
 * START
 ************************************************/

loadCounts();

startScanner();


</script>

</body>

</html>
