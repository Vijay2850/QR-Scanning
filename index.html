<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Freshers Meet QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
}

.header {
    background: #111;
    color: white;
    padding: 20px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 8px 0 0;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 15px;
}

#reader {
    width: 100%;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    margin-top: 15px;
}

#result {
    margin-top: 20px;
    padding: 25px;
    border-radius: 15px;
    background: white;
    font-size: 20px;
    font-weight: bold;
    min-height: 110px;
}

.success {
    background: #d4edda !important;
    color: #155724;
}

.duplicate {
    background: #fff3cd !important;
    color: #856404;
}

.invalid {
    background: #f8d7da !important;
    color: #721c24;
}

.error {
    background: #f8d7da !important;
    color: #721c24;
}

.loading {
    background: #e2e3e5 !important;
    color: #383d41;
}

</style>

</head>


<body>

<div class="header">

    <h1>🎉 Freshers Meet</h1>

    <p>Entry QR Scanner</p>

</div>


<div class="container">

    <div id="reader"></div>

    <div id="result">
        📷 Point the camera at a QR code
    </div>

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyKc6GiLjQH-DCquXjg_33NOn0RD-BRfjwoPW26UcyPU79DN9fq2gZp9gr2vf2S51xTEA/exec";


// =====================================================
// VARIABLES
// =====================================================

let scanner = null;

let scanning = false;


// =====================================================
// DISPLAY RESULT
// =====================================================

function showResult(type, message) {

    const result =
        document.getElementById("result");

    result.className = type;

    result.innerHTML = message;

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}


// =====================================================
// CHECK QR
// =====================================================

function checkQR(registrationID) {

    showResult(
        "loading",
        "⏳ Checking registration..."
    );


    // Unique callback function
    const callbackName =
        "attendanceCallback_" +
        Date.now();


    // Create callback
    window[callbackName] =
        function(response) {

            console.log(
                "Google response:",
                response
            );


            // Remove callback
            delete window[callbackName];


            // =========================================
            // SUCCESS
            // =========================================

            if (
                response.status ===
                "success"
            ) {

                showResult(

                    "success",

                    "🟢 ENTRY CONFIRMED" +

                    "<br><br>" +

                    "Name: <b>" +

                    escapeHTML(
                        response.name
                    ) +

                    "</b>" +

                    "<br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        response.registrationID
                    ) +

                    "</b>" +

                    "<br><br>" +

                    "Entry Time: " +

                    escapeHTML(
                        response.time
                    )

                );

            }


            // =========================================
            // DUPLICATE
            // =========================================

            else if (
                response.status ===
                "duplicate"
            ) {

                showResult(

                    "duplicate",

                    "🟠 ALREADY CHECKED IN" +

                    "<br><br>" +

                    "Name: <b>" +

                    escapeHTML(
                        response.name
                    ) +

                    "</b>" +

                    "<br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        response.registrationID
                    ) +

                    "</b>" +

                    "<br><br>" +

                    "First Entry: " +

                    escapeHTML(
                        response.time
                    )

                );

            }


            // =========================================
            // INVALID
            // =========================================

            else if (
                response.status ===
                "invalid"
            ) {

                showResult(

                    "invalid",

                    "🔴 INVALID QR CODE" +

                    "<br><br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        response.registrationID ||
                        registrationID
                    ) +

                    "</b>"

                );

            }


            // =========================================
            // ERROR
            // =========================================

            else {

                showResult(

                    "error",

                    "❌ SERVER ERROR" +

                    "<br><br>" +

                    escapeHTML(
                        response.message ||
                        "Unknown error"
                    )

                );

            }


            // Restart scanner
            setTimeout(
                startScanner,
                3000
            );

        };


    // =============================================
    // CREATE JSONP SCRIPT
    // =============================================

    const script =
        document.createElement("script");


    script.src =
        API_URL +

        "?id=" +

        encodeURIComponent(
            registrationID
        ) +

        "&callback=" +

        encodeURIComponent(
            callbackName
        );


    // =============================================
    // ERROR
    // =============================================

    script.onerror =
        function(error) {

            console.error(
                "JSONP request failed:",
                error
            );


            delete window[callbackName];


            showResult(

                "error",

                "❌ ATTENDANCE CONNECTION FAILED" +

                "<br><br>" +

                "QR detected: " +

                escapeHTML(
                    registrationID
                ) +

                "<br><br>" +

                "<small>" +

                "The Google API could not be reached."

                + "</small>"

            );


            setTimeout(
                startScanner,
                3000
            );

        };


    // Add script to page
    document.body.appendChild(
        script
    );

}


// =====================================================
// QR SCANNED
// =====================================================

function onScanSuccess(decodedText) {

    if (scanning) {
        return;
    }


    scanning = true;


    console.log(
        "QR scanned:",
        decodedText
    );


    if (scanner) {

        scanner
            .clear()
            .catch(
                function() {}
            );

    }


    checkQR(
        decodedText.trim()
    );

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

    // Normal scan failures ignored.

}


// =====================================================
// START CAMERA
// =====================================================

function startScanner() {

    scanning = false;


    const reader =
        document.getElementById(
            "reader"
        );


    reader.innerHTML = "";


    scanner =
        new Html5QrcodeScanner(

            "reader",

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                rememberLastUsedCamera:
                    true

            },

            false

        );


    scanner.render(

        onScanSuccess,

        onScanFailure

    );

}


// =====================================================
// START APPLICATION
// =====================================================

startScanner();


</script>

</body>

</html>
