<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Freshers Party 2026 - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        #f4f4f4;

    text-align: center;

}

.header {

    background:
        #111;

    color:
        white;

    padding:
        20px;

}

.header h1 {

    margin:
        0;

    font-size:
        25px;

}

.header p {

    margin:
        8px 0 0;

}


.stats {

    display:
        flex;

    gap:
        10px;

    padding:
        12px;

    max-width:
        600px;

    margin:
        auto;

}

.stat {

    flex:
        1;

    background:
        white;

    border-radius:
        14px;

    padding:
        15px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);

}

.stat-number {

    font-size:
        32px;

    font-weight:
        bold;

}

.stat-label {

    font-size:
        14px;

    margin-top:
        5px;

}


.container {

    width:
        100%;

    max-width:
        600px;

    margin:
        auto;

    padding:
        10px 15px 30px;

}


#reader {

    width:
        100%;

    background:
        white;

    border-radius:
        15px;

    overflow:
        hidden;

    margin-top:
        5px;

}


#result {

    margin-top:
        15px;

    padding:
        22px;

    border-radius:
        15px;

    background:
        white;

    font-size:
        18px;

    font-weight:
        bold;

    min-height:
        110px;

}


.success {

    background:
        #d4edda !important;

    color:
        #155724;

}


.duplicate {

    background:
        #fff3cd !important;

    color:
        #856404;

}


.invalid {

    background:
        #f8d7da !important;

    color:
        #721c24;

}


.error {

    background:
        #f8d7da !important;

    color:
        #721c24;

}


.loading {

    background:
        #e2e3e5 !important;

    color:
        #383d41;

}


button {

    border:
        none;

    border-radius:
        10px;

    padding:
        12px 20px;

    font-size:
        16px;

}

</style>

</head>


<body>


<div class="header">

    <h1>🎉 Freshers Party 2026</h1>

    <p>Entry QR Scanner</p>

</div>


<div class="stats">

    <div class="stat">

        <div
            class="stat-number"
            id="registered">
            -
        </div>

        <div
            class="stat-label">
            REGISTERED
        </div>

    </div>


    <div class="stat">

        <div
            class="stat-number"
            id="present">
            -
        </div>

        <div
            class="stat-label">
            PRESENT
        </div>

    </div>

</div>


<div class="container">

    <div id="reader"></div>


    <div id="result">

        📷 Point the camera at a QR code

    </div>

</div>


<script>


/************************************************
 * IMPORTANT
 *
 * PUT YOUR APPS SCRIPT /EXEC URL HERE
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwxvYNdhrAH3YhlZkOdGO1Mx5fNpASyMqrb1h5H2CWsl0VhfaFjKd_TLGU0V6G2KTw9YA/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let processing = false;


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value || "");

    return div.innerHTML;

}


/************************************************
 * SHOW RESULT
 ************************************************/

function showResult(
    type,
    message
) {

    const result =
        document.getElementById(
            "result"
        );

    result.className =
        type;

    result.innerHTML =
        message;

}


/************************************************
 * UPDATE COUNTS
 ************************************************/

function updateCounts(data) {

    if (
        typeof data.registered !==
        "undefined"
    ) {

        document.getElementById(
            "registered"
        ).textContent =
            data.registered;

    }


    if (
        typeof data.present !==
        "undefined"
    ) {

        document.getElementById(
            "present"
        ).textContent =
            data.present;

    }

}


/************************************************
 * LOAD COUNTS
 ************************************************/

function loadCounts() {

    const callbackName =
        "countCallback_" +
        Date.now();


    window[callbackName] =
        function(data) {

            updateCounts(data);

            delete window[
                callbackName
            ];

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +
        "?callback=" +
        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function() {

            delete window[
                callbackName
            ];

        };


    document.body.appendChild(
        script
    );

}


/************************************************
 * CHECK QR
 ************************************************/

function checkQR(
    registrationID
) {

    showResult(
        "loading",
        "⏳ Checking registration..."
    );


    const callbackName =
        "attendanceCallback_" +
        Date.now();


    let finished = false;


    window[callbackName] =
        function(data) {

            if (finished) {
                return;
            }

            finished = true;


            delete window[
                callbackName
            ];


            updateCounts(data);


            /****************************************
             * SUCCESS
             ****************************************/

            if (
                data.status ===
                "success"
            ) {

                showResult(

                    "success",

                    "🟢 ENTRY CONFIRMED" +

                    "<br><br>" +

                    "Name: <b>" +

                    escapeHTML(
                        data.name
                    ) +

                    "</b>" +

                    "<br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        data.registrationID
                    ) +

                    "</b>" +

                    "<br><br>" +

                    "Entry Time: " +

                    escapeHTML(
                        data.time
                    )

                );

            }


            /****************************************
             * DUPLICATE
             ****************************************/

            else if (
                data.status ===
                "duplicate"
            ) {

                showResult(

                    "duplicate",

                    "🟠 ALREADY CHECKED IN" +

                    "<br><br>" +

                    "Name: <b>" +

                    escapeHTML(
                        data.name
                    ) +

                    "</b>" +

                    "<br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        data.registrationID
                    ) +

                    "</b>" +

                    "<br><br>" +

                    "First Entry: " +

                    escapeHTML(
                        data.time
                    )

                );

            }


            /****************************************
             * INVALID
             ****************************************/

            else if (
                data.status ===
                "invalid"
            ) {

                showResult(

                    "invalid",

                    "🔴 INVALID QR CODE" +

                    "<br><br>" +

                    "Registration ID: <b>" +

                    escapeHTML(
                        data.registrationID
                    ) +

                    "</b>"

                );

            }


            /****************************************
             * SERVER ERROR
             ****************************************/

            else {

                showResult(

                    "error",

                    "❌ SERVER ERROR" +

                    "<br><br>" +

                    escapeHTML(
                        data.message ||
                        "Unknown error"
                    )

                );

            }


            setTimeout(
                restartScanner,
                3000
            );

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +

        "?id=" +

        encodeURIComponent(
            registrationID
        ) +

        "&callback=" +

        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function() {

            if (finished) {
                return;
            }

            finished = true;


            delete window[
                callbackName
            ];


            showResult(

                "error",

                "❌ Cannot connect to attendance server."

            );


            setTimeout(
                restartScanner,
                3000
            );

        };


    document.body.appendChild(
        script
    );

}


/************************************************
 * QR FOUND
 ************************************************/

function onScanSuccess(
    decodedText
) {

    if (processing) {

        return;

    }


    processing = true;


    if (scanner) {

        scanner.clear()
            .catch(
                function() {}
            );

    }


    const id =
        String(
            decodedText
        ).trim();


    if (!id) {

        processing = false;

        restartScanner();

        return;

    }


    checkQR(id);

}


/************************************************
 * SCAN FAILURE
 ************************************************/

function onScanFailure(
    error
) {

    // Normal camera scanning.
    // Ignore failed frames.

}


/************************************************
 * START SCANNER
 ************************************************/

function startScanner() {

    processing = false;


    const reader =
        document.getElementById(
            "reader"
        );


    reader.innerHTML = "";


    scanner =
        new Html5QrcodeScanner(

            "reader",

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                },

                rememberLastUsedCamera:
                    true

            },

            false

        );


    scanner.render(

        onScanSuccess,

        onScanFailure

    );

}


/************************************************
 * RESTART SCANNER
 ************************************************/

function restartScanner() {

    processing = false;

    loadCounts();

    startScanner();

}


/************************************************
 * INITIAL LOAD
 ************************************************/

loadCounts();

startScanner();


</script>


</body>

</html>
